name: D1 Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only schema dump
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          q() {
            out=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command "$2" --json 2>/dev/null \
              | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(d[0].results))")
            {
              echo "### $1"
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          q "migrations" "SELECT group_concat(name, ' ') AS m FROM (SELECT name FROM _migrations ORDER BY name)"
          q "tables" "SELECT group_concat(name, ' ') AS t FROM (SELECT name FROM sqlite_master WHERE type='table' ORDER BY name)"
          q "orders_cols" "SELECT group_concat(name, ' ') AS c FROM pragma_table_info('orders')"
          q "order_items_cols" "SELECT group_concat(name, ' ') AS c FROM pragma_table_info('order_items')"
          q "staff_cols" "SELECT group_concat(name, ' ') AS c FROM pragma_table_info('staff_members')"
